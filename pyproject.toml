[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hourly-pay-planner"
version = "0.1.0"
description = "Local cross-platform planner for academic hourly pay distribution"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6>=6.8,<7",
    "SQLAlchemy>=2.0,<3",
    "pydantic>=2.9,<3",
    "openpyxl>=3.1,<4",
    "python-docx>=1.1,<2",
    "docxtpl>=0.19,<1",
    "platformdirs>=4.3,<5",
    "holidays>=0.60,<1",
    "alembic>=1.13,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hourly_pay"]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-qt>=4.4,<5",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "pyinstaller>=6.11,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true
